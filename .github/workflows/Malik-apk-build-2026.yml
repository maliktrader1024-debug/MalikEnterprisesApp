name: Malik Enterprises Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Malik Enterprises APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f -name settings.gradle.kts \
            -not -path '/.gradle/' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Expected settings.gradle.kts and app/build.gradle.kts."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malik-Enterprises-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
