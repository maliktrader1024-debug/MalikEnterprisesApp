 - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malik-Enterprises-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: errorV
